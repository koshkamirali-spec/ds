
name: Build JARVIS Cyber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract JARVIS ZIP
        id: project
        shell: bash
        run: |
          ZIP=$(find . -type f -iname '*jarvis*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p app_source
            unzip -oq "$ZIP" -d app_source
          fi

          PROJECT=$(find . -type f -name pubspec.yaml \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found!"
            exit 1
          fi

          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Project
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --project-name jarvis_assistant .

      - name: Install Dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Build JARVIS APK
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --debug

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CYBER-APK
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
